[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "search-service-byom"
version = "1.0.1"
description = "Search Service for Distributed Issue Tracker - Full-text search and faceted queries powered by Elasticsearch with real-time indexing and multi-type search"
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-NC-4.0"
authors = [{name = "om kumar sahu", email = "omkumarsahu747@gmail.com"}]
maintainers = [{name = "om kumar sahu", email = "omkumarsahu747@gmail.com"}]
keywords = ["fastapi", "search", "elasticsearch", "full-text-search", "faceted-search", "indexing", "microservices", "query"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "pydantic[email]==2.5.0",
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.11",
    "asyncpg==0.29.0",
    "redis==5.0.1",
    "httpx==0.25.2",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.6",
    "celery==5.3.4",
    "pika==1.3.2",
    "elasticsearch==8.10.0",
    "opentelemetry-api==1.21.0",
    "opentelemetry-sdk==1.21.0",
    "opentelemetry-exporter-jaeger==1.21.0",
    "opentelemetry-instrumentation-fastapi==0.42b0",
    "opentelemetry-instrumentation-sqlalchemy==0.42b0",
    "opentelemetry-instrumentation-redis==0.42b0",
    "alembic==1.13.1",
    "python-dotenv==1.0.0",
]

[project.urls]
Homepage = "https://github.com/omkumar01/Distributed-Issue-Tracker-FastAPI-Microservices-"
Repository = "https://github.com/omkumar01/Distributed-Issue-Tracker-FastAPI-Microservices-"
Documentation = "https://github.com/omkumar01/Distributed-Issue-Tracker-FastAPI-Microservices-/tree/master/services/search-service"
"Bug Tracker" = "https://github.com/omkumar01/Distributed-Issue-Tracker-FastAPI-Microservices-/issues"

[tool.setuptools]
package-dir = {"" = "."}
packages.find.where = ["."]
packages.find.include = ["src*", "shared*"]
packages.find.exclude = ["tests*"]